controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

arm_controller:
  ros__parameters:
    joints:
      - joint_1_base_yaw
      - joint_2_shoulder
      - joint_3_elbow
      - joint_4_wrist_pitch
      - joint_5_wrist_roll
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.6

gripper_controller:
  ros__parameters:
    joint: gripper_left_finger_joint   # right jaw mimics it
    allow_stalling: true
    goal_tolerance: 0.002
    max_effort: 30.0
